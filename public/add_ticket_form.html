<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Ticket</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/bootstrap.css" />

    <link
      rel="stylesheet"
      href="/assets/vendors/perfect-scrollbar/perfect-scrollbar.css"
    />
    <link
      rel="stylesheet"
      href="/assets/vendors/bootstrap-icons/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="/assets/css/app.css" />
    <link
      rel="shortcut icon"
      href="/assets/images/favicon.svg"
      type="image/x-icon"
    />
  </head>

  <body>
    <div id="app">
      {% include 'components/sidebar.html' %}
      <div id="main">
        <header class="mb-3">
          <a href="#" class="burger-btn d-block d-xl-none">
            <i class="bi bi-justify fs-3"></i>
          </a>
        </header>

        <div class="page-heading">
          <div class="page-title">
            <div class="row">
              <div class="col-12 col-md-6 order-md-1 order-last">
                <h3>Adicionar Novo Ticket</h3>
              </div>
            </div>
          </div>
          <section class="section">
            <div class="card">
              <div class="card-body">
                {# CARD FORM #}
                <div class="card">
                  <div class="card-content">
                    <div class="card-body">
                      {# -form- #}
                      <form class="form form-vertical">
                        <div class="form-body">
                          <div class="row">
                            <div class="col-12">
                              <div class="form-group">
                                <label for="first-name-vertical">Produto</label>
                                <fieldset class="form-group">
                                  <select class="form-select" id="basicSelect">
                                    <option>EAD</option>
                                    <option>SEMI PRESENCIAL</option>
                                    <option>PRESENCIAL</option>
                                  </select>
                                </fieldset>
                              </div>
                            </div>
                            <div class="col-12">
                              <div class="form-group">
                                <label for="email-id-vertical">Titulo</label>
                                <input
                                  type="text"
                                  id="email-id-vertical"
                                  class="form-control"
                                  name="email-id"
                                  placeholder="Titulo"
                                />
                              </div>
                            </div>
                            <div class="col-12">
                              <div class="form-group mb-3">
                                <label
                                  for="exampleFormControlTextarea1"
                                  class="form-label"
                                  >Descrição</label
                                >
                                <textarea
                                  class="form-control"
                                  id="exampleFormControlTextarea1"
                                  rows="6"
                                ></textarea>
                              </div>
                            </div>
                            <div class="col-12">
                              <div class="form-group">
                                <label for="password-vertical"
                                  >WhatsApp para contato (DDD + Número)</label
                                >
                                <input
                                  type="number"
                                  id="password-vertical"
                                  class="form-control"
                                  name="contact"
                                  placeholder="Exemplo: 21911111111"
                                />
                              </div>
                            </div>

                            <div class="col-12 d-flex justify-content-end">
                              <button
                                type="submit"
                                class="btn btn-primary me-1 mb-1"
                              >
                                Add Ticket
                              </button>
                              <button
                                type="reset"
                                class="btn btn-light-secondary me-1 mb-1"
                              >
                                Limpar
                              </button>
                            </div>
                          </div>
                        </div>
                      </form>
                    </div>
                  </div>
                </div>
                {# // CARD FORM #}
              </div>
            </div>
          </section>
        </div>

        {% include 'components/footer.html' %}
      </div>
    </div>
    <script src="/assets/vendors/perfect-scrollbar/perfect-scrollbar.min.js"></script>
    <script src="/assets/js/bootstrap.bundle.min.js"></script>

    <script src="/assets/js/main.js"></script>
  </body>
</html>
